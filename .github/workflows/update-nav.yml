name: 每日自動更新基金淨值

on:
  schedule:
    # 每週一至五 UTC 10:00（台灣時間下午 6:00，收盤後更新）
    - cron: '0 10 * * 1-5'
  workflow_dispatch:   # 也可以在 GitHub 網頁手動觸發

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 抓取基金淨值並更新 data.json
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, datetime, sys

          FUND_CODE = 'B080291'   # 鉅亨：JPM多重收益(美元對沖)A股穩定月配

          # 嘗試多個 API 路徑
          URLS = [
              f'https://fund.api.cnyes.com/fund/api/v2/funds/{FUND_CODE}/historicalNav?format=json&limit=1',
              f'https://fund.api.cnyes.com/fund/api/v2/funds/{FUND_CODE}/nav',
          ]

          def try_nav(raw):
              for fn in [
                  lambda: float(raw['items']['fund'][0]['nav']),
                  lambda: float(raw['items'][0]['nav']),
                  lambda: float(raw['data']['items'][0]['nav']),
                  lambda: float(raw['data']['nav']),
                  lambda: float(raw['nav']),
              ]:
                  try:
                      v = fn()
                      if v > 0:
                          return v
                  except:
                      pass
              return None

          nav = None
          for url in URLS:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      raw = json.loads(r.read())
                  nav = try_nav(raw)
                  if nav:
                      print(f'取得淨值: {nav} (來源: {url})')
                      break
              except Exception as e:
                  print(f'嘗試失敗 {url}: {e}')

          if nav is None:
              print('無法取得淨值，略過更新')
              sys.exit(0)   # 不視為錯誤，避免 Actions 發出失敗通知

          # 讀取現有 data.json
          try:
              with open('data.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except:
              data = {}

          today = datetime.date.today().strftime('%Y/%m/%d')
          data['fundNav']   = nav
          data['navDate']   = today
          data['navSource'] = 'GitHub Actions / Anue'

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f'data.json 已更新：fundNav={nav}, date={today}')
          PYEOF

      - name: 提交並推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 若 data.json 無異動（非交易日/淨值未變）則不提交
          git diff --staged --quiet && echo "無變動，略過提交" || \
            git commit -m "Auto: 更新基金淨值 $(date +%Y/%m/%d)" && git push
