name: 每日自動更新基金淨值與匯率

on:
  schedule:
    - cron: '10 1 * * *'   # 每天 UTC 01:10（台北時間 09:10）。原本設在整點(01:00)，
                            # GitHub官方文件指出排程workflow在「每個整點」是尖峰時段，
                            # 容易被延後執行、負載太高時甚至可能直接被跳過不執行；
                            # 往後挪10分鐘避開整點，降低被延遲/跳過的機率
  workflow_dispatch:        # 可手動觸發，方便第一次設定時測試

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安裝相依套件
        run: pip install openpyxl cryptography requests beautifulsoup4 lxml --quiet

      - name: 抓取最新淨值/匯率並更新常駐Excel與data.json
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 daily_nav_update.py

      - name: 提交並推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/eminemollie/finance.git
          git add data.json financial-workbook.enc
          git diff --staged --quiet && echo "無變動，略過提交" || \
            git commit -m "每日自動更新：基金淨值／匯率 ($(date +%Y/%m/%d\ %H:%M))" && git push origin main
