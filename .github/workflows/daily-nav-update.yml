name: 每日自動更新基金淨值與匯率

on:
  schedule:
    - cron: '10 1 * * *'   # 每天 UTC 01:10（台北時間 09:10）。抓匯率、抓前一交易日基金淨值。
                            # 不設在整點，降低GitHub尖峰時段延遲/跳過的機率
    - cron: '5 7 * * *'    # 每天 UTC 07:05（台北時間 15:05）。2026-09-19調整：原本13:50改為15:05，
                            # 確保台股(0050/0052)13:30收盤後有更高機率抓到當日收盤價，
                            # 並留緩衝因應GitHub排程延遲
    - cron: '5 12 * * *'   # 每天 UTC 12:05（台北時間 20:05）。2026-09-19新增：晚間補跑，
                            # 避免前兩次都被GitHub延遲或跳過時整天沒更新到
  workflow_dispatch:        # 可手動觸發，方便測試或需要立即準確快照時使用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安裝相依套件
        run: pip install openpyxl cryptography requests beautifulsoup4 lxml --quiet

      - name: 抓取最新淨值/匯率並更新常駐Excel與data.json
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 daily_nav_update.py

      - name: 提交並推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/eminemollie/finance.git
          git add data.json financial-workbook.enc
          git diff --staged --quiet && echo "無變動，略過提交" || \
            git commit -m "每日自動更新：基金淨值／匯率 ($(date +%Y/%m/%d\ %H:%M))" && git push origin main
